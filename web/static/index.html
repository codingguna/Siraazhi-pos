<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Siraazhi Pro POS — Vanur FPC Ltd</title>
  <meta name="theme-color" content="#134e19">
  <meta name="description" content="Professional Billing, Multi-Printer, Inventory & GST Suite for Vanur Farmer Producer Company Ltd">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <!-- SheetJS for offline native Excel (.xlsx) export (100% offline) -->
  <script src="js/xlsx.full.min.js"></script>
</head>
<body>

  <!-- TOP EXECUTIVE APP HEADER -->
  <header class="app-header">
    <div class="brand-cluster">
      <img src="assets/logo.png" class="brand-logo" alt="Siraazhi Logo">
      <div class="brand-titles">
        <div class="brand-tamil">சீராழி <span class="brand-en">Siraazhi</span></div>
        <div class="brand-sub">VANUR FARMER PRODUCER COMPANY LIMITED • Pure Traditional chekku Oils</div>
      </div>
    </div>

    <!-- Quick Status Bar & Actions -->
    <div class="header-tools">
      <button class="tool-btn" id="printQueueBtn" title="Master Hardware Print Queue" onclick="showPrintQueueModal()" style="display:none;">
        🖨️ Queue <span class="queue-badge" id="printQueueBadge" style="display:none;">0</span>
      </button>
      <button class="tool-btn" id="qrBtn" title="Connect Mobile / Tablet over Wi-Fi" onclick="showNetworkModal()">
        📱 Mobile / LAN Access
      </button>
      <div class="status-indicator online" id="statusPill" title="Local System Active">
        <span class="dot"></span> <span id="statusText">Host Active</span>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="nav-tabs" id="navTabs">
    <button data-tab="dash">📊 Dashboard</button>
    <button data-tab="pos">🧾 POS Billing (F2)</button>
    <button data-tab="inventory">🛢 Stock & Catalog</button>
    <button data-tab="production">🏭 Batch Crushing</button>
    <button data-tab="purchases">🌾 Procurement</button>
    <button data-tab="expenses">💸 Expenses</button>
    <button data-tab="bills">📑 Sales & Invoices</button>
    <button data-tab="gstr1">🏛 GST & CA Reports</button>
    <button data-tab="settings">⚙ Settings & Printers</button>
  </nav>

  <!-- MAIN VIEWPORT -->
  <main class="main-content">

    <!-- 1. POS BILLING SECTION -->
    <!-- INCLUDE: pages/pos.html -->

    <!-- 2. DASHBOARD SECTION -->
    <!-- INCLUDE: pages/dash.html -->

    <!-- 3. INVENTORY & CATALOG SECTION -->
    <!-- INCLUDE: pages/inventory.html -->

    <!-- 4. BATCH CRUSHING / PRODUCTION -->
    <!-- INCLUDE: pages/production.html -->

    <!-- 5. PURCHASES SECTION -->
    <!-- INCLUDE: pages/purchases.html -->

    <!-- 6. EXPENSES SECTION -->
    <!-- INCLUDE: pages/expenses.html -->

    <!-- 7. SALES & INVOICES REGISTER -->
    <!-- INCLUDE: pages/bills.html -->

    <!-- 8. GST & CA REPORTS -->
    <!-- INCLUDE: pages/gstr1.html -->

    <!-- 9. SETTINGS & PRINTERS -->
    <!-- INCLUDE: pages/settings.html -->

  </main>

  <!-- PRINT CONTAINER (Hidden in screen, active during window.print) -->
  <div id="printContainer" class="print-container"></div>

  <!-- APPLICATION MODALS & OVERLAYS -->
  <!-- INCLUDE: pages/modals.html -->

  <!-- SCRIPTS -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/print.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(function(reg) {
        reg.update();
      }).catch(console.error);

      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (!refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
