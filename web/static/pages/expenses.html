    <!-- 6. EXPENSES SECTION -->
    <section id="tab-expenses" class="tab-pane">
      <div class="dash-columns">
        <div class="panel-box">
          <h3>💸 Log Operational Overhead Expense</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Date:</label>
              <input type="date" id="exDate">
            </div>
            <div class="form-group">
              <label>Expense Head:</label>
              <select id="exHead">
                <option value="Crushing charge">Crushing charge / ஆட்டுக்கூலி</option>
                <option value="Labour">Labour / கூலி</option>
                <option value="Transport">Transport / வண்டி வாடகை</option>
                <option value="Electricity">Electricity / மின்சாரம்</option>
                <option value="Bottles/Packing">Bottles & Packing / பாட்டில் பேக்கிங்</option>
                <option value="Rent">Rent / வாடகை</option>
                <option value="Other">Other Miscellaneous</option>
              </select>
            </div>
            <div class="form-group">
              <label>Amount (₹):</label>
              <input type="number" id="exAmt" placeholder="Amount ₹">
            </div>
            <div class="form-group">
              <label>Details / Notes:</label>
              <input type="text" id="exNote" placeholder="e.g. Paid to crushing operator">
            </div>
            <button class="btn btn-primary" onclick="saveExpense()">Save Expense</button>
          </div>
        </div>

        <div class="panel-box">
          <h3>Expense Log</h3>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Category</th>
                  <th>Amount (₹)</th>
                  <th>Note</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="expensesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
