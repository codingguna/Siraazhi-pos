    <!-- 3. INVENTORY & CATALOG SECTION -->
    <section id="tab-inventory" class="tab-pane">
      <div class="panel-box">
        <div class="panel-toolbar">
          <h2>Product Inventory & Price Catalog</h2>
          <div class="toolbar-actions">
            <button class="btn btn-primary" onclick="openProductModal()">+ Add New Product</button>
            <button class="btn btn-outline" onclick="openAdjustModal()">⚖ Quick Stock Adjust</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="data-table" id="inventoryTable">
            <thead>
              <tr>
                <th>Product Name</th>
                <th>Category</th>
                <th>HSN</th>
                <th>Barcode</th>
                <th>GST %</th>
                <th>MRP (₹)</th>
                <th>Selling Rate (₹)</th>
                <th>Stock</th>
                <th>Stock Value</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </div>
    </section>
