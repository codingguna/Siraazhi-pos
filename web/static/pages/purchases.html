    <!-- 5. PURCHASES SECTION -->
    <section id="tab-purchases" class="tab-pane">
      <div class="dash-columns">
        <div class="panel-box">
          <h3>🌾 Log Procurement (Seeds / Bottles / Packing)</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Date:</label>
              <input type="date" id="puDate">
            </div>
            <div class="form-group">
              <label>Supplier / Farmer Name:</label>
              <input type="text" id="puSupplier" placeholder="e.g. Murugan - Vanur Farmer">
            </div>
            <div class="form-group">
              <label>Material / Item Name:</label>
              <input type="text" id="puItem" placeholder="e.g. Raw Sesame Seeds / 1L Bottles">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Quantity:</label>
                <input type="number" id="puQty" placeholder="Qty">
              </div>
              <div class="form-group">
                <label>Unit:</label>
                <select id="puUnit">
                  <option value="kg">kg</option>
                  <option value="bag">bag</option>
                  <option value="pcs">pcs</option>
                  <option value="litre">litre</option>
                  <option value="box">box</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Total Cost (₹):</label>
              <input type="number" id="puCost" placeholder="Total Cost in ₹">
            </div>
            <div class="form-group">
              <label>Notes:</label>
              <input type="text" id="puNote" placeholder="Receipt / batch details">
            </div>
            <button class="btn btn-primary" onclick="savePurchase()">Save Procurement Record</button>
          </div>
        </div>

        <div class="panel-box">
          <h3>Procurement History</h3>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Item</th>
                  <th>Qty</th>
                  <th>Cost (₹)</th>
                  <th>Supplier</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="purchasesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
